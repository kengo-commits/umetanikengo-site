name: Post the daily set to Instagram

on:
  schedule:
    - cron: '10 23 * * *'   # 08:10 JST every day
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to post (YYYY-MM-DD, default today in JST)'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      IG_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install pillow requests playwright
          python -m playwright install --with-deps chromium

      - name: Render today's set
        run: python scripts/make_instagram.py ${IG_DATE:-$(TZ=Asia/Tokyo date +%F)}

      - name: Stage media on the site
        run: python scripts/post_instagram.py stage

      - name: Commit media
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A world/ig
          if ! git diff --cached --quiet; then
            git commit -m "Daily set $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase -q && git push
          fi

      - name: Build site
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        if: vars.PUBLISH == 'true'
        uses: actions/deploy-pages@v4

      - name: Publish to Instagram
        env:
          IG_POST_TOKEN: ${{ secrets.IG_POST_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/post_instagram.py publish

      - name: Record the post
        run: |
          git add -A world/ig
          if ! git diff --cached --quiet; then
            git commit -m "Daily set posted"
            git pull --rebase -q && git push
          fi
