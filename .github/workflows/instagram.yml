name: Post the daily set to Instagram

on:
  schedule:
    - cron: '10 2 * * *'   # 11:10 JST every day (after the morning news has landed)
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to post (YYYY-MM-DD, default today in JST)'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      IG_DATE: ${{ inputs.date }}
    steps:
      - name: Check the posting token
        env:
          IG_POST_TOKEN: ${{ secrets.IG_POST_TOKEN }}
        run: |
          if [ -z "$IG_POST_TOKEN" ]; then
            echo "IG_POST_TOKEN is not set yet; nothing to post today"
            echo "SKIP=1" >> $GITHUB_ENV
          fi

      - if: env.SKIP != '1'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: env.SKIP != '1'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install
        if: env.SKIP != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install pillow requests playwright
          python -m playwright install --with-deps chromium

      - name: Pick the day
        if: env.SKIP != '1'
        run: |
          D=${IG_DATE:-$(python -c "import json;print(json.load(open('world/news.json'))['days'][0]['date'])")}
          echo "IG_DATE=$D" >> $GITHUB_ENV
          echo "posting $D"

      - name: Render the set
        if: env.SKIP != '1'
        run: python scripts/make_instagram.py "$IG_DATE"

      - name: Stage media on the site
        if: env.SKIP != '1'
        run: python scripts/post_instagram.py stage

      - name: Commit media
        if: env.SKIP != '1'
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A world/ig
          if ! git diff --cached --quiet; then
            git commit -m "Daily set $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase -q && git push
          fi

      - name: Build site
        if: env.SKIP != '1'
        run: python build.py

      - if: env.SKIP != '1'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

      - id: deployment
        if: env.SKIP != '1' && vars.PUBLISH == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Publish to Instagram
        if: env.SKIP != '1'
        env:
          IG_POST_TOKEN: ${{ secrets.IG_POST_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/post_instagram.py publish

      - name: Publish to Threads
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python scripts/post_instagram.py threads

      - name: Record the post
        if: env.SKIP != '1'
        run: |
          git add -A world/ig
          if ! git diff --cached --quiet; then
            git commit -m "Daily set posted"
            git pull --rebase -q && git push
          fi
