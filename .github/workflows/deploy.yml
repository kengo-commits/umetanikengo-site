name: Update Instagram and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install
        run: pip install pillow requests

      - name: Fetch latest Instagram posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_POST_TOKEN: ${{ secrets.IG_POST_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python scripts/fetch_instagram.py

      - name: Add today's artwork to KENGO'S SYNESTHESIA
        continue-on-error: true
        run: python scripts/add_plate.py

      - name: Render the day's Digital Art to share images (OGP, Pinterest, Stories)
        continue-on-error: true
        run: |
          pip install playwright >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
          python scripts/render_art.py

      - name: Save refreshed tokens
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          save() {
            if [ -f "$2" ] && [ -n "$GH_TOKEN" ]; then
              gh secret set "$1" --repo "$GITHUB_REPOSITORY" < "$2" && echo "$1 updated"
            fi
            rm -f "$2"
          }
          save IG_TOKEN .ig_token_new
          save IG_POST_TOKEN .ig_post_token_new
          save THREADS_TOKEN .threads_token_new

      - name: Commit updated posts
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add data/instagram.json images/instagram world/plates.json world/media world/art
          if ! git diff --cached --quiet; then
            git commit -m "Update Instagram posts and today's artwork"
            git push
          fi

      - name: Build site
        run: python build.py

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  # Publishing is switched off while the site is being edited.
  # To publish: Settings → Secrets and variables → Actions → Variables → add PUBLISH = true
  deploy:
    needs: build
    if: vars.PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Notify search engines (IndexNow)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          sleep 30
          HOST=www.kengo-umetani.com
          KEY=9dc82838f11c46ef8a532ce014911510
          URLS=$(curl -s "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -s -o /dev/null -w "IndexNow %{http_code}\n" -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URLS}" \
            https://api.indexnow.org/indexnow
