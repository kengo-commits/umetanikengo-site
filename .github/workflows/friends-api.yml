name: Deploy FRIEND SNS API

# KENGO FRIEND SNS の裏側（Cloudflare Worker + D1 + R2）を配備します。
# 必要な Secret: CLOUDFLARE_API_TOKEN（README の手順を参照）。Account ID は下の env に記載。
# 初回は D1 データベースと R2 バケットを自動で作成し、API のアドレスを data/friends-api.json に記録して、サイトを再公開します。

on:
  push:
    branches: [main]
    paths:
      - 'friends-api/**'
      - '.github/workflows/friends-api.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: friends-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The account id is not a secret; it is the first path segment of the Cloudflare dashboard URL.
      CLOUDFLARE_ACCOUNT_ID: bf37badc9738a168d187e5f454566b36
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN を Settings → Secrets and variables → Actions に登録してください（README「KENGO FRIEND SNS」参照）"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        working-directory: friends-api
        run: npm ci --no-audit --no-fund

      - name: Create the D1 database if missing
        working-directory: friends-api
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="kengo-friend-sns") | .uuid' | head -1)
          if [ -z "$ID" ]; then
            npx wrangler d1 create kengo-friend-sns
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="kengo-friend-sns") | .uuid' | head -1)
          fi
          [ -n "$ID" ] || { echo "::error::D1 database id not found"; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          echo "D1 database: $ID"

      - name: Create the R2 bucket if missing
        working-directory: friends-api
        run: |
          if ! npx wrangler r2 bucket list 2>/dev/null | grep -q 'kengo-friend-sns-media'; then
            npx wrangler r2 bucket create kengo-friend-sns-media
          fi

      - name: Apply database migrations
        working-directory: friends-api
        run: npx wrangler d1 migrations apply kengo-friend-sns --remote

      - name: Deploy the Worker
        working-directory: friends-api
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::workers.dev のアドレスを取得できませんでした。Cloudflare の Workers & Pages でサブドメインを設定してから再実行してください"; exit 1; }
          echo "API_URL=$URL" >> "$GITHUB_ENV"
          echo "API: $URL"

      - name: Check the API
        run: |
          sleep 5
          curl -sS --fail "$API_URL/status"
          echo

      - name: Record the API address for the site
        run: |
          printf '{\n "url": "%s",\n "updated": "%s"\n}\n' "$API_URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/friends-api.json
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git checkout -- friends-api/wrangler.toml
          rm -f friends-api/deploy.log
          git add data/friends-api.json
          if ! git diff --cached --quiet; then
            git commit -m "Record FRIEND SNS API address"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Republish the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
