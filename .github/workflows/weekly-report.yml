name: Weekly report

on:
  schedule:
    - cron: '5 23 * * 0'   # Monday 08:05 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Write the report
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_POST_TOKEN: ${{ secrets.IG_POST_TOKEN }}
        run: python scripts/weekly_report.py
      - name: Commit
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add reports
          if ! git diff --cached --quiet; then
            git commit -m "Weekly report"
            git pull --rebase -q && git push
          fi
