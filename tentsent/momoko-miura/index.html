<script>
(function(){var as=[].slice.call(document.querySelectorAll('#gal a')),lb=document.getElementById('lb'),im=document.getElementById('lb-img'),cur=0;
function show(i){cur=(i+as.length)%as.length;im.src=as[cur].href;lb.hidden=false;document.body.style.overflow='hidden'}
function hide(){lb.hidden=true;document.body.style.overflow=''}
as.forEach(function(a,i){a.addEventListener('click',function(e){e.preventDefault();show(i)})});
document.getElementById('lb-x').onclick=hide;document.getElementById('lb-p').onclick=function(){show(cur-1)};document.getElementById('lb-n').onclick=function(){show(cur+1)};
lb.addEventListener('click',function(e){if(e.target===lb)hide()});
addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')hide();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
var sx=0;lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});lb.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1))});
})();
</script>
