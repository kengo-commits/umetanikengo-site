table{border-collapse:collapse;margin-top:26px;width:100%;max-width:320px;border-top:1px solid var(--fg);font-size:13px;line-height:2.1}

.links{display:flex;gap:24px;flex-wrap:wrap;margin-top:24px}

.sec-t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:12px;margin:0 0 20px}
.gal{columns:3;column-gap:12px}

.pn{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);margin-top:64px;padding:28px 0 56px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);object-fit:contain}
.lb button{position:absolute;background:none;border:0;color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:16px}
.lb .x{top:env(safe-area-inset-top,0px);right:8px}.lb .p{left:0;top:50%}.lb .n{right:0;top:50%}
footer{border-top:1px solid var(--line);padding:32px 0;font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:center}
.comps{margin-bottom:56px}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.comp img{width:100%;height:auto;border:1px solid var(--line);background:#fff}
.comp-b{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.dl{display:inline-block;padding:10px 18px;border:1px solid var(--fg);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.dl:hover{background:var(--fg);color:var(--bg)}
@media (max-width:700px){
.slider{display:block;margin-top:48px}
.slider .sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scroll-padding-inline:max(16px,env(safe-area-inset-left,0px))}
.slider .sl::-webkit-scrollbar{display:none}
.slider .sl a{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;height:72svh;height:72vh;display:grid;place-items:center;background:var(--line)}
.slider .sl img{width:100%;height:100%;object-fit:contain}
.gal-ctr{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gal-ctr .dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.gal-ctr .dots i{width:4px;height:4px;border-radius:50%;background:var(--line);display:block}
.gal-ctr .dots i.on{background:var(--fg)}
}
@media (min-width:701px){.slider{display:none}}
</style>

<script>
(function(){var as=[].slice.call(document.querySelectorAll('#gal a')),lb=document.getElementById('lb'),im=document.getElementById('lb-img'),cur=0;
function show(i){cur=(i+as.length)%as.length;im.src=as[cur].href;lb.hidden=false;document.body.style.overflow='hidden'}
function hide(){lb.hidden=true;document.body.style.overflow=''}
as.forEach(function(a,i){a.addEventListener('click',function(e){e.preventDefault();show(i)})});
document.getElementById('lb-x').onclick=hide;document.getElementById('lb-p').onclick=function(){show(cur-1)};document.getElementById('lb-n').onclick=function(){show(cur+1)};
lb.addEventListener('click',function(e){if(e.target===lb)hide()});
addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')hide();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
var sx=0;lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});lb.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1))});
})();
</script>
<script>
(function(){if(!matchMedia('(max-width:700px)').matches)return;var g=document.getElementById('gal'),as=[].slice.call(g.querySelectorAll('a')),sl=document.getElementById('sl'),ctr=document.getElementById('gal-ctr');if(!sl||!ctr)return;var num=ctr.querySelector('b'),dots=ctr.querySelector('.dots');
as.forEach(function(a,i){var c=document.createElement('a');c.href=a.href;c.innerHTML='<img alt="" loading="lazy" decoding="async">';c.querySelector('img').src=a.href;c.querySelector('img').alt=a.querySelector('img').alt;c.addEventListener('click',function(e){e.preventDefault();a.click()});sl.appendChild(c);dots.appendChild(document.createElement('i'))});
function upd(){var w=sl.clientWidth,i=Math.round(sl.scrollLeft/(w+8));i=Math.max(0,Math.min(as.length-1,i));num.textContent=(i+1)+' / '+as.length;var d=dots.children;for(var k=0;k<d.length;k++)d[k].className=k===i?'on':''}
sl.addEventListener('scroll',function(){requestAnimationFrame(upd)},{passive:true});upd();})();
</script>
